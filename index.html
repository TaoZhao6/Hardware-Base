<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="2d9AWWJMDcoMJ1VNJpFljQ">
<head data-page-node-id="mGaz3ba3TxP5krT93GDUcR">
<meta charset="UTF-8" data-page-node-id="SZSlyh0gi9FpHYL4SV7CBJ" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="FoWtNHnWtPMveC1urTu4pq" />
<title>硬件学习知识库</title>
<style>
:root{
  --bg:#f5f6f8;
  --card:#ffffff;
  --text:#1f2430;
  --muted:#6b7280;
  --primary:#2f6fed;
  --primary-soft:#e8effc;
  --border:#e5e8ee;
  --amber-bg:#fef3c7; --amber-text:#92400e; --amber-bd:#fde68a;
  --indigo-bg:#eef2ff; --indigo-text:#4338ca;
  --green-bg:#e7f6ec;  --green-text:#15803d;
  --red-soft:#fdecec;  --red-text:#b91c1c;
  --blue-bg:#e8effc;  --blue-text:#2f6fed;
  --shadow:0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none !important}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  padding:14px 24px;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,#2f6fed,#5a8bff);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#fff;flex-shrink:0;
}
.brand h1{font-size:20px;font-weight:700;letter-spacing:.5px}
.brand p{font-size:12px;color:var(--muted);margin-top:1px}
.search-wrap{flex:1;min-width:220px;max-width:520px;position:relative}
.search-wrap input{
  width:100%;padding:10px 14px 10px 38px;
  border:1px solid var(--border);border-radius:10px;
  font-size:14px;background:#fff;color:var(--text);outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.55}

/* ---------- 工具栏 ---------- */
.toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 24px 0;flex-wrap:wrap;
}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:6px 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--border);background:#fff;color:var(--muted);
  font-size:13px;transition:all .15s;
}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.toolbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;flex-wrap:wrap}
.view-toggle button{
  padding:8px 14px;border:none;background:transparent;cursor:pointer;
  font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;
  transition:background .15s,color .15s;
}
.view-toggle button.active{background:var(--primary);color:#fff;font-weight:600}

/* ---------- 通用按钮 ---------- */
.btn{
  padding:8px 14px;border-radius:10px;border:1px solid var(--border);
  background:#fff;color:var(--text);font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:all .15s;
}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.primary:hover{background:#1f5bd6;color:#fff}
.btn.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.danger:hover{border-color:var(--red-text);color:var(--red-text);background:var(--red-soft)}

/* ---------- 统计 ---------- */
.stats{padding:12px 24px 0;font-size:13px;color:var(--muted)}
.stats b{color:var(--primary);font-weight:700}

/* ---------- 主区 ---------- */
main{padding:16px 24px 20px}
.day-title{
  font-size:14px;font-weight:700;color:var(--muted);
  margin:22px 0 10px;padding-left:10px;
  border-left:3px solid var(--primary);
}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);
  transition:box-shadow .2s, transform .2s;
}
.card:hover{box-shadow:0 6px 18px rgba(16,24,40,.08)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-head h3{font-size:17px;font-weight:700;line-height:1.4;cursor:pointer}
.card-head h3:hover{color:var(--primary)}
.cat-badge{
  flex-shrink:0;padding:3px 10px;border-radius:999px;
  background:var(--indigo-bg);color:var(--indigo-text);font-size:12px;font-weight:600;
}
.summary{color:var(--muted);font-size:13.5px;margin:8px 0 2px}
.section{margin-top:14px}
.sec-title{
  font-size:13px;font-weight:700;color:var(--text);
  display:flex;align-items:center;gap:7px;margin-bottom:6px;
}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.dot.core{background:var(--primary)}
.dot.rel{background:var(--green-text)}
.dot.warn{background:#f59e0b}
.points{list-style:none;counter-reset:pt}
.points li{position:relative;padding:3px 0 3px 26px;font-size:14px}
.points li::before{
  counter-increment:pt;content:counter(pt);
  position:absolute;left:0;top:7px;width:18px;height:18px;
  background:var(--primary-soft);color:var(--primary);
  font-size:11px;font-weight:700;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
}
.point-fig{margin:10px 0 4px}
.point-fig img{
  max-width:100%;max-height:320px;border-radius:10px;border:1px solid var(--border);
  cursor:zoom-in;display:block;background:#fff;
}
.point-fig figcaption{font-size:12.5px;color:var(--muted);margin-top:6px;text-align:center}
.rel-wrap{display:flex;flex-wrap:wrap;gap:7px}
.rel{padding:4px 11px;border-radius:8px;font-size:12.5px;background:var(--green-bg);color:var(--green-text)}
.mistakes{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--amber-bg);border:1px solid var(--amber-bd)}
.mistakes .sec-title{color:var(--amber-text)}
.mistake-list{list-style:none;margin-top:4px}
.mistake-list li{font-size:13.5px;color:#6b4b00;padding:2px 0 2px 20px;position:relative}
.mistake-list li::before{content:"⚠";position:absolute;left:0;top:1px;font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.tag{padding:3px 10px;border-radius:6px;font-size:12px;background:#f1f3f7;color:var(--muted);border:1px solid var(--border)}

/* ---------- 状态徽章 ---------- */
.st-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.st-todo{background:var(--amber-bg);color:var(--amber-text)}
.st-doing{background:var(--blue-bg);color:var(--blue-text)}
.st-done{background:var(--green-bg);color:var(--green-text)}

/* ---------- 掌握度 ---------- */
.mastery{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.mastery-bar{flex:1;height:6px;border-radius:999px;background:#eef0f4;overflow:hidden;min-width:40px;max-width:140px}
.mastery-fill{height:100%;border-radius:999px;transition:width .25s}
.mastery-val{font-weight:700;color:var(--text);min-width:34px;text-align:right}
.mastery-lvl{font-weight:600;min-width:40px}

/* ---------- 卡片元信息栏 ---------- */
.meta-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:11px;font-size:12px;color:var(--muted)}
.meta-item{display:inline-flex;align-items:center;gap:4px}
.view-entry{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--primary);font-size:12px;cursor:pointer;font-weight:600;transition:all .15s}
.view-entry:hover{background:var(--primary-soft);border-color:var(--primary)}

/* ---------- 看板 ---------- */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.board-col{background:#eef0f4;border-radius:14px;padding:12px;min-height:180px;border:1px solid transparent;transition:border-color .15s, background .15s}
.board-col.drag-over{background:#e4ecfd;border-color:var(--primary)}
.board-col-head{display:flex;align-items:center;justify-content:space-between;padding:3px 6px 11px;gap:8px}
.board-col-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.board-col-title .dot{width:10px;height:10px;border-radius:3px}
.board-col .cnt{background:#fff;border:1px solid var(--border);border-radius:999px;font-size:11.5px;color:var(--muted);padding:1px 9px;font-weight:600}
.board-list{display:flex;flex-direction:column;gap:10px;min-height:40px}
.board-empty{font-size:12.5px;color:#a0a7b3;text-align:center;padding:22px 10px;border:1px dashed var(--border);border-radius:10px;background:#fafbfc}
.board-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);transition:box-shadow .15s, transform .15s}
.board-card:hover{box-shadow:0 6px 16px rgba(16,24,40,.1);transform:translateY(-1px)}
.board-card h4{font-size:14.5px;font-weight:700;line-height:1.45}
.board-card .b-summary{font-size:12.5px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.board-card .b-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.board-card .b-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.board-card .b-date{color:#a0a7b3}

/* ---------- 日历 ---------- */
.cal-card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px}
.cal-title{font-size:16px;font-weight:700}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);background:#fafbfc;border-bottom:1px solid var(--border)}
.cal-week span{text-align:center;padding:8px 0;font-size:12px;color:var(--muted);font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{
  min-height:74px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:6px;cursor:pointer;position:relative;transition:background .12s;background:#fff;
}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell:hover{background:#f5f7fb}
.cal-cell.other{background:#fafbfc}
.cal-cell.other .dnum{color:#c2c7d0}
.cal-cell.today .dnum{background:var(--primary);color:#fff}
.cal-cell.selected{box-shadow:inset 0 0 0 2px var(--primary);background:var(--primary-soft)}
.cal-cell .dnum{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--text)}
.cal-dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.cal-dot{width:6px;height:6px;border-radius:50%}
.cal-cell .cal-count{font-size:10.5px;color:var(--muted);position:absolute;bottom:5px;right:8px;font-weight:600}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:10px 18px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
.cal-legend .lg{display:inline-flex;align-items:center;gap:5px}
.cal-day-panel{padding:14px 18px 18px}
.cal-day-panel .cdp-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px}
.cal-day-list{display:flex;flex-direction:column;gap:10px}
.cal-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;transition:all .15s}
.cal-item:hover{border-color:var(--primary);background:var(--primary-soft)}
.cal-item .ci-badge{flex-shrink:0}
.cal-item .ci-body{flex:1;min-width:0}
.cal-item .ci-title{font-size:14px;font-weight:600}
.cal-item .ci-summary{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-item .ci-meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 编辑模式：卡片操作栏 ---------- */
.flat-list{display:flex;flex-direction:column;gap:14px}
.flat-list .card{margin-bottom:0}
.card-actions{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:16px;padding-top:12px;border-top:1px dashed var(--border);
}
.drag-handle{
  cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;
  color:var(--muted);font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;
}
.drag-handle:active{cursor:grabbing}
.drag-handle:hover{background:var(--primary-soft);color:var(--primary)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.act{
  min-width:34px;height:36px;padding:0 11px;border:1px solid var(--border);
  background:#fff;color:var(--muted);border-radius:8px;cursor:pointer;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;
}
.act:hover{border-color:var(--primary);color:var(--primary)}
.act.danger:hover{border-color:var(--red-text);color:var(--red-text);background:var(--red-soft)}
.sort-ghost{opacity:.4;background:var(--primary-soft);border:1px dashed var(--primary)}

/* ---------- 思维导图 ---------- */
#mapView{position:relative;height:calc(100vh - 200px);min-height:420px;background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}
#mindmap{width:100%;height:100%;display:block}
.map-hint{
  position:absolute;right:16px;bottom:14px;z-index:5;
  font-size:12px;color:var(--muted);background:rgba(255,255,255,.85);
  padding:6px 12px;border-radius:8px;border:1px solid var(--border);
  pointer-events:none;
}
.map-loading{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;flex-direction:column;gap:10px}
.spinner{width:26px;height:26px;border:3px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tree-fallback{height:100%;overflow:auto;margin:0;padding:22px;font-family:Consolas,"Courier New",monospace;font-size:13.5px;line-height:1.9;white-space:pre;color:#334155}
.fallback-note{padding:10px 16px;font-size:12.5px;color:var(--red-text);background:var(--red-soft);border-bottom:1px solid #f3c6c6}

/* ---------- 空状态 ---------- */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:12px}
.empty p{font-size:14px}

/* ---------- 模态框 ---------- */
.modal{
  position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.45);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal-card{
  background:#fff;border-radius:16px;width:100%;max-width:680px;max-height:90vh;
  display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);
  animation:pop .18s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:17px;font-weight:700}
.close{border:none;background:transparent;font-size:20px;color:var(--muted);cursor:pointer;width:34px;height:34px;border-radius:8px;line-height:1}
.close:hover{background:#f1f3f7;color:var(--text)}
.modal-body{padding:18px 22px;overflow-y:auto}
.form-row{margin-bottom:15px}
.form-row label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.form-row label em{color:var(--red-text);font-style:normal}
.form-row .hint{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
.form-row input[type=text],.form-row input[type=date],.form-row textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;
  font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.form-row input:focus,.form-row textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.form-row textarea{resize:vertical;line-height:1.6}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);flex-wrap:wrap}

/* ---------- 核心要点编辑器（逐条） ---------- */
.point-row{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fafbfc}
.point-row-head{display:flex;gap:8px;align-items:flex-start}
.p-text{
  flex:1;resize:vertical;min-height:46px;padding:8px 10px;border:1px solid var(--border);
  border-radius:8px;font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;line-height:1.6;
}
.p-text:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.p-ops{display:flex;gap:6px;flex-direction:column}
.p-btn{
  min-width:34px;height:34px;border:1px solid var(--border);background:#fff;color:var(--muted);
  border-radius:8px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;
}
.p-btn:hover{border-color:var(--primary);color:var(--primary)}
.p-btn.danger:hover{border-color:var(--red-text);color:var(--red-text)}
.p-file{display:none}
.p-img{margin-top:10px}
.p-thumb{max-width:100%;max-height:200px;border-radius:8px;display:block;border:1px solid var(--border);background:#fff;cursor:zoom-in}
.p-thumb:hover{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.p-img-foot{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.p-paste-tip{font-size:12px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:5px;line-height:1.4}
.p-paste-tip kbd{background:#f1f3f7;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-family:inherit;font-size:11px}

/* 右键粘贴菜单 */
.ctx-menu{
  position:fixed;z-index:400;background:#fff;border:1px solid var(--border);
  border-radius:10px;box-shadow:0 12px 32px rgba(16,24,40,.2);min-width:170px;
  padding:6px;display:flex;flex-direction:column;gap:2px;
}
.ctx-menu button{
  display:flex;align-items:center;gap:9px;padding:9px 12px;border:none;background:transparent;
  border-radius:7px;cursor:pointer;font-size:13px;color:var(--text);text-align:left;font-family:inherit;
}
.ctx-menu button:hover{background:var(--primary-soft);color:var(--primary)}
.ctx-menu button.danger:hover{background:var(--red-soft);color:var(--red-text)}
.ctx-menu button:disabled{opacity:.4;cursor:not-allowed;background:transparent;color:var(--muted)}
.ctx-menu .sep{height:1px;background:var(--border);margin:4px 0}
.p-caption{
  flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;
  font-family:inherit;color:var(--text);background:#fff;outline:none;
}
.p-caption:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}

/* ---------- 详情模态框 ---------- */
.detail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.detail-top h3{font-size:19px;font-weight:700;line-height:1.4}
.detail-badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.detail-meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin:6px 0 2px}
.detail-meta .dm{display:inline-flex;align-items:center;gap:5px}
.detail-summary{color:var(--muted);font-size:14px;margin:8px 0 2px}
.detail-panel{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:16px;background:#fafbfc}
.detail-panel .dp-title{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.status-row{display:flex;gap:8px;flex-wrap:wrap}
.status-btn{padding:7px 14px;border-radius:9px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.status-btn:hover{border-color:var(--primary);color:var(--primary)}
.status-btn.on{border-color:var(--primary);background:var(--primary);color:#fff}
.mastery-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.mastery-row .mr-label{font-size:12.5px;font-weight:600;color:var(--muted)}
.mastery-row input[type=range]{flex:1;min-width:140px;accent-color:var(--primary)}
.auto-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.auto-toggle input{accent-color:var(--primary);cursor:pointer}
.detail-body-sec{margin-top:18px}

/* ---------- 图片灯箱 ---------- */
.lightbox{
  position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.86);
  display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;
}
.lightbox img{max-width:92vw;max-height:80vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lightbox-caption{color:#fff;margin-top:14px;font-size:14px;text-align:center;max-width:90vw}
.lightbox-close{
  position:absolute;top:16px;right:20px;background:rgba(255,255,255,.16);border:none;color:#fff;
  font-size:22px;width:42px;height:42px;border-radius:50%;cursor:pointer;line-height:1;
}
.lightbox-close:hover{background:rgba(255,255,255,.3)}

/* ---------- 悬浮新增按钮 ---------- */
.fab{
  position:fixed;right:20px;bottom:24px;z-index:90;
  width:56px;height:56px;border-radius:50%;border:none;
  background:var(--primary);color:#fff;font-size:28px;line-height:1;
  box-shadow:0 8px 20px rgba(47,111,237,.4);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s, background .15s;
}
.fab:hover{transform:translateY(-2px);background:#1f5bd6}

/* ---------- 提示 ---------- */
.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
  background:#1f2430;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 页脚 ---------- */
.foot{
  display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;
  padding:10px 24px 30px;font-size:12.5px;color:var(--muted);
}
.foot .link{border:none;background:transparent;color:var(--primary);cursor:pointer;font-size:12.5px;text-decoration:underline;padding:0}
.foot .link:hover{color:#1f5bd6}
.foot .link.danger{color:var(--red-text)}

@media(max-width:900px){
  .board{grid-template-columns:1fr}
}
@media(max-width:640px){
  .topbar{padding:12px 16px}
  .toolbar{padding:12px 16px 0}
  main{padding:12px 16px 16px}
  .view-toggle button{padding:7px 10px;font-size:12px}
  .two-col{grid-template-columns:1fr}
  .fab{right:16px;bottom:18px}
  .act{min-width:40px;height:40px}
  .p-btn{min-width:40px;height:40px}
  .modal{padding:10px}
  .modal-card{max-height:95vh;border-radius:14px}
  .modal-head,.modal-body,.modal-foot{padding-left:16px;padding-right:16px}
  .cal-cell{min-height:48px;padding:4px}
  .cal-cell .dnum{width:20px;height:20px;font-size:11px}
  .cal-dots{display:none}
  .cal-cell .cal-count{font-size:9px;bottom:3px;right:4px}
  .cal-week span{font-size:10px;padding:6px 0}
  .cal-head,.cal-legend,.cal-day-panel{padding-left:12px;padding-right:12px}
}

<script>
(function(){
  const STORAGE_KEY = 'hardware_learning_kb_v1';
  const SEED = () => (window.KNOWLEDGE_DATA || []).map(d => ({ ...d }));

  const STATUS = {
    todo:  { label:'待学',   icon:'📥', color:'#f59e0b', bg:'#fef3c7', text:'#92400e', cls:'st-todo'  },
    doing: { label:'进行中', icon:'🔄', color:'#2f6fed', bg:'#e8effc', text:'#2f6fed', cls:'st-doing' },
    done:  { label:'已掌握', icon:'✅', color:'#15803d', bg:'#e7f6ec', text:'#15803d', cls:'st-done'  }
  };
  const STATUS_ORDER = ['todo', 'doing', 'done'];

  let DATA = loadData();
  let activeCategory = '全部';
  let searchTerm = '';
  let view = 'board';      // 'board' | 'calendar' | 'list' | 'map'
  let editMode = false;
  let mm = null;           // markmap 实例
  let sortable = null;     // SortableJS 实例（列表）
  let boardSortables = []; // SortableJS 实例（看板列）
  let editingId = null;    // 模态框正在编辑的条目 id；null 表示新增
  let ctxRow = null;       // 右键菜单当前作用的要点行
  let detailId = null;     // 详情模态框正在查看的条目 id
  let calCursor = null;    // 日历当前显示年月 {y, m}
  let calSelected = '';    // 日历选中的日期 YYYY-MM-DD

  const $ = id => document.getElementById(id);

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function pad(n){ return String(n).padStart(2,'0'); }
  function today(){
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }
  function fmtDate(y, m, d){ return `${y}-${pad(m+1)}-${pad(d)}`; }

  /* ---------- 数据规范化：要点字符串 → {text,image,caption}；补状态字段 ---------- */
  function normalizePoint(p){
    if(p == null) return { text: '', image: null, caption: '' };
    if(typeof p === 'string') return { text: p, image: null, caption: '' };
    return {
      text: typeof p.text === 'string' ? p.text : '',
      image: typeof p.image === 'string' && p.image ? p.image : null,
      caption: typeof p.caption === 'string' ? p.caption : ''
    };
  }
  function normalizeEntry(d){
    const status = (d.status === 'todo' || d.status === 'doing' || d.status === 'done') ? d.status : 'todo';
    const viewCount = Number.isFinite(d.viewCount) ? Math.max(0, Math.floor(d.viewCount)) : 0;
    const mastery = (typeof d.mastery === 'number' && Number.isFinite(d.mastery)) ? Math.max(0, Math.min(100, Math.round(d.mastery))) : null;
    return { ...d, points: (d.points || []).map(normalizePoint), status, viewCount, mastery };
  }
  function normalizeData(arr){
    return (arr || []).map(normalizeEntry);
  }
  function pointText(p){ return typeof p === 'string' ? p : (p && p.text) || ''; }

  /* ---------- 掌握程度 ---------- */
  function autoMastery(n){
    const table = [0, 20, 40, 60, 75, 85, 90, 93, 95, 98];
    return table[Math.min(n, table.length - 1)];
  }
  function computedMastery(d){
    if(d.mastery != null) return d.mastery;
    return autoMastery(d.viewCount || 0);
  }
  function masteryLevel(p){
    if(p >= 80) return { label:'精通', color:'#15803d' };
    if(p >= 60) return { label:'熟练', color:'#2f6fed' };
    if(p >= 40) return { label:'熟悉', color:'#0891b2' };
    if(p >= 20) return { label:'入门', color:'#d97706' };
    return { label:'未掌握', color:'#b91c1c' };
  }

  /* ---------- 持久化 ---------- */
  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw !== null){
        const arr = JSON.parse(raw);
        if(Array.isArray(arr)) return normalizeData(arr);
      }
    }catch(e){ /* ignore */ }
    return normalizeData(SEED());
  }

  function saveData(silent){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }
    catch(e){ toast('⚠ 保存失败：本地存储空间不足，请删除部分图片'); return; }
    if(!silent) toast('已保存 ✓');
  }

  let toastTimer;
  function toast(msg){
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
  }

  /* ---------- 分类 ---------- */
  function renderCategories(){
    const cats = ['全部', ...Array.from(new Set(DATA.map(d => d.category)))];
    $('categoryChips').innerHTML = '';
    cats.forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip' + (c === activeCategory ? ' active' : '');
      b.textContent = c;
      b.onclick = () => { activeCategory = c; renderCategories(); render(); };
      $('categoryChips').appendChild(b);
    });
  }

  function fillDatalist(){
    const cats = Array.from(new Set(DATA.map(d => d.category)));
    $('catOptions').innerHTML = cats.map(c => `<option value="${esc(c)}"></option>`).join('');
  }

  /* ---------- 过滤 ---------- */
  function filtered(){
    const t = searchTerm.trim().toLowerCase();
    return DATA.filter(d => {
      if(activeCategory !== '全部' && d.category !== activeCategory) return false;
      if(!t) return true;
      const hay = [
        d.title, d.summary, d.category,
        ...(d.tags || []),
        ...(d.points || []).flatMap(p => typeof p === 'string' ? [p] : [p.text || '', p.caption || '']),
        ...(d.related || []), ...(d.mistakes || [])
      ].join(' ').toLowerCase();
      return hay.includes(t);
    });
  }

  /* ---------- 统计 ---------- */
  function updateStats(){
    const total = DATA.length;
    const cats = new Set(DATA.map(d => d.category)).size;

  /* ---------- 思维导图 ---------- */
  function buildMarkdown(items){
    let md = '# 硬件学习知识库\n';
    const byCat = {};
    items.forEach(d => { (byCat[d.category] = byCat[d.category] || []).push(d); });
    for(const cat of Object.keys(byCat)){
      md += `## ${cat}\n`;
      byCat[cat].forEach(d => {
        const st = STATUS[d.status] || STATUS.todo;
        md += `### ${d.title}（${st.label} · ${computedMastery(d)}%）\n`;
        if(d.summary) md += `- 【概述】${d.summary}\n`;
        if((d.points || []).length){
          md += `- 【核心要点】\n`;
          d.points.forEach(p => md += `  - ${pointText(p)}\n`);
        }
        if((d.related || []).length) md += `- 【关联知识】${d.related.join('、')}\n`;
        if((d.mistakes || []).length){
          md += `- 【易错点】\n`;
          d.mistakes.forEach(m => md += `  - ${m}\n`);
        }
      });
    }
    return md;
  }

  function fallbackTree(md){
    const pre = document.createElement('pre');
    pre.className = 'tree-fallback';
    pre.textContent = md.split('\n').filter(Boolean).map(l => {
      if(l.startsWith('# '))  return l.slice(2);
      if(l.startsWith('## ')) return '  ' + l.slice(3);
      if(l.startsWith('### '))return '    ' + l.slice(4);
      if(l.startsWith('  - '))return '      ' + l.trim();
      if(l.startsWith('- '))  return '        ' + l.slice(2);
      return '        ' + l;
    }).join('\n');
    return pre.outerHTML;
  }

  /* ---------- 拖拽排序 ---------- */
  function applySortOrder(orderedIds){
    if(!orderedIds.length) return;
    const vis = new Set(orderedIds);
    const nonVis = DATA.filter(d => !vis.has(d.id));
    let before = 0;
    for(const d of DATA){
      if(d.id === orderedIds[0]) break;
      if(!vis.has(d.id)) before++;
    }
    const visible = orderedIds.map(id => DATA.find(d => d.id === id)).filter(Boolean);
    DATA = [...nonVis.slice(0, before), ...visible, ...nonVis.slice(before)];
    saveData();
  }

  function reorderByStatus(status, ids){
    const set = new Set(ids);
    const ordered = ids.map(id => DATA.find(x => x.id === id)).filter(Boolean);
    const rest = DATA.filter(d => !set.has(d.id));
    const anchor = rest.findIndex(d => d.status === status);
    const idx = anchor === -1 ? rest.length : anchor;
    DATA = [...rest.slice(0, idx), ...ordered, ...rest.slice(idx)];
  }

  function moveEntry(id, dir){
    const i = DATA.findIndex(d => d.id === id);
    const j = i + dir;
    if(i < 0 || j < 0 || j >= DATA.length) return;
    const t = DATA[i]; DATA[i] = DATA[j]; DATA[j] = t;
    saveData();
    render();
  }

  let sortablePromise = null;
  function ensureSortable(){
    if(window.Sortable) return Promise.resolve(window.Sortable);
    if(sortablePromise) return sortablePromise;
    sortablePromise = import('https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js')
      .then(mod => { window.Sortable = mod.default || mod.Sortable || window.Sortable; return window.Sortable; })
      .catch(() => null);
    return sortablePromise;
  }

  async function setupSortable(){
    const el = $('sortableList');
    if(!el) return;
    if(sortable){ try{ sortable.destroy(); }catch(e){} sortable = null; }
    const S = await ensureSortable();
    if(!S) return;
    sortable = new S(el, {
      handle: '.drag-handle',

      ghostClass: 'sort-ghost',
      onEnd(){

  /* ---------- 图片压缩 ---------- */
  function fileToDataURL(file, maxW = 1280, quality = 0.85){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const w = img.width, h = img.height;
          if(w <= maxW && file.size <= 250 * 1024){ resolve(reader.result); return; }
          const scale = Math.min(1, maxW / w);
          const cw = Math.round(w * scale), ch = Math.round(h * scale);
          const canvas = document.createElement('canvas');
          canvas.width = cw; canvas.height = ch;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, cw, ch);
          ctx.drawImage(img, 0, 0, cw, ch);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => reject(new Error('image load failed'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('read failed'));
      reader.readAsDataURL(file);
    });
  }

  function dataURLtoBlob(dataUrl){
    const i = dataUrl.indexOf(',');
    const mime = dataUrl.slice(0, i).match(/data:(.*?)(;|$)/)[1] || 'image/png';
    const bin = atob(dataUrl.slice(i + 1));
    const arr = new Uint8Array(bin.length);
    for(let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
    return new Blob([arr], { type: mime });
  }

  async function copyRowImage(row){

    try{
      const blob = dataURLtoBlob(dataUrl);
      await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
      toast('图片已复制到剪贴板');
    }catch(e){
      toast('复制失败，浏览器不支持，请长按/右键图片保存');
    }
  }

  async function pasteFromClipboard(row){
    try{
      if(!navigator.clipboard || !navigator.clipboard.read){
        toast('当前环境不支持读取剪贴板，请直接用 Ctrl+V 粘贴');
        return;
      }
      const items = await navigator.clipboard.read();
      let found = false;
      for(const item of items){
        const t = item.types.find(x => x.startsWith('image/'));
        if(t){
          const blob = await item.getType(t);
          const dataUrl = await fileToDataURL(blob);
          setRowImage(row, dataUrl);
          toast('截图已粘贴 ✓');
          found = true;
          break;
        }
      }
      if(!found) toast('剪贴板中没有图片');
    }catch(e){
      toast('读取剪贴板失败，请直接在输入框按 Ctrl+V');
    }
  }

  /* ---------- 模态框（新增/编辑） ---------- */
  function parseLines(v){ return v.split('\n').map(s => s.trim()).filter(Boolean); }

  function openModal(entry){
    editingId = entry ? entry.id : null;
    $('modalTitle').textContent = entry ? '编辑知识点' : '新增知识点';
    $('f-title').value = entry ? entry.title : '';
    $('f-category').value = entry ? entry.category : '';
    $('f-date').value = entry ? entry.date : today();
    $('f-summary').value = entry ? (entry.summary || '') : '';
    renderPointRows(entry ? entry.points : []);
    $('f-related').value = entry ? (entry.related || []).join('\n') : '';
    $('f-mistakes').value = entry ? (entry.mistakes || []).join('\n') : '';
    $('f-tags').value = entry ? (entry.tags || []).join(', ') : '';
    fillDatalist();
    $('modal').classList.remove('hidden');
    setTimeout(() => $('f-title').focus(), 50);
  }

  function closeModal(){
    $('modal').classList.add('hidden');
    editingId = null;
  }

  function saveForm(){
    const title = $('f-title').value.trim();
    if(!title){ toast('请先填写标题'); $('f-title').focus(); return; }
    if(editingId === null){
      const entry = {
        title: title,
        category: $('f-category').value.trim() || '未分类',
        date: $('f-date').value || today(),
        summary: $('f-summary').value.trim(),
        points: collectPoints(),
        related: parseLines($('f-related').value),
        mistakes: parseLines($('f-mistakes').value),
        tags: $('f-tags').value.split(/[,，、]/).map(s => s.trim()).filter(Boolean),
        status: 'todo',
        viewCount: 0,
        mastery: null
      };
      entry.id = DATA.reduce((m, d) => Math.max(m, d.id || 0), 0) + 1;
      DATA.push(entry);
    }else{
      const i = DATA.findIndex(d => d.id === editingId);
      if(i >= 0){
        const prev = DATA[i];
        DATA[i] = {
          ...prev,
          title: title,
          category: $('f-category').value.trim() || '未分类',
          date: $('f-date').value || today(),
          summary: $('f-summary').value.trim(),
          points: collectPoints(),
          related: parseLines($('f-related').value),
          mistakes: parseLines($('f-mistakes').value),
          tags: $('f-tags').value.split(/[,，、]/).map(s => s.trim()).filter(Boolean)
        };
      }
    }
    saveData();
    closeModal();
    refresh();
  }

  function deleteEntry(id){
    const d = DATA.find(x => x.id === id);
    if(!d) return;
    if(!confirm(`确定删除「${d.title}」？此操作不可撤销。`)) return;
    DATA = DATA.filter(x => x.id !== id);
    saveData();
    refresh();
  }

  /* ---------- 详情模态框 ---------- */
  function renderDetail(d){
    const p = computedMastery(d);
    const lv = masteryLevel(p);
    const s = STATUS[d.status] || STATUS.todo;
    const points = (d.points || []).map(pointHTML).join('');
    const related = (d.related || []).map(r => `<span class="rel">${esc(r)}</span>`).join('');
    const mistakes = (d.mistakes || []).map(m => `<li>${esc(m)}</li>`).join('');
    const tags = (d.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
    const auto = d.mastery == null;

    $('detailBody').innerHTML = `
      <div class="detail-top">
        <h3>${esc(d.title)}</h3>
        <span class="cat-badge">${esc(d.category)}</span>
      </div>
      <div class="detail-badges">${statusBadgeHTML(d)}</div>
      <div class="detail-meta">
        <span class="dm">📅 ${esc(d.date)}</span>
        <span class="dm">👁 已学习 <b>${d.viewCount || 0}</b> 次</span>
        <span class="dm">${auto ? '🤖 掌握度自动计算' : '✍️ 掌握度手动设置'}</span>
      </div>
      ${d.summary ? `<p class="detail-summary">${esc(d.summary)}</p>` : ''}

      <div class="detail-panel">
        <div class="dp-title">🎯 学习状态</div>
        <div class="status-row">
          ${STATUS_ORDER.map(st => {
            const s = STATUS[st];
            return `<button class="status-btn ${st === d.status ? 'on' : ''}" data-dact="status" data-status="${st}">${s.icon} ${s.label}</button>`;
          }).join('')}
        </div>
        <div class="mastery-row">
          <span class="mr-label">📊 掌握程度</span>
          <input type="range" id="detailRange" min="0" max="100" step="1" value="${p}" ${auto ? 'disabled' : ''} />
          <div class="mastery-bar" style="flex:0 0 90px"><div class="mastery-fill" id="detailFill" style="width:${p}%;background:${lv.color}"></div></div>
          <span class="mastery-lvl" id="detailLvl" style="color:${lv.color};font-weight:700">${lv.label}</span>
          <span class="mastery-val" id="detailPct" style="font-weight:700;color:${lv.color}">${p}%</span>
          <label class="auto-toggle">
            <input type="checkbox" id="detailAuto" ${auto ? 'checked' : ''} /> 按学习次数自动
          </label>
        </div>
      </div>

      ${points ? `<div class="section detail-body-sec">
        <div class="sec-title"><span class="dot core"></span>核心要点</div>
        <ol class="points">${points}</ol>
      </div>` : ''}
      ${related ? `<div class="section detail-body-sec">
        <div class="sec-title"><span class="dot rel"></span>关联知识</div>
        <div class="rel-wrap">${related}</div>
      </div>` : ''}
      ${mistakes ? `<div class="mistakes detail-body-sec">
        <div class="sec-title"><span class="dot warn"></span>易错点</div>
        <ul class="mistake-list">${mistakes}</ul>
      </div>` : ''}
      ${tags ? `<div class="tags">${tags}</div>` : ''}
    `;
  }

  function openDetail(id){
    const d = DATA.find(x => x.id === id);
    if(!d) return;
    d.viewCount = (d.viewCount || 0) + 1;
    saveData(true);
    detailId = id;
    renderDetail(d);
    $('detailModal').classList.remove('hidden');
  }

  function closeDetail(){
    $('detailModal').classList.add('hidden');
    detailId = null;
    refresh(); // 关闭时刷新主区（学习次数等可能已变）
  }

  /* ---------- 图片灯箱 ---------- */
  function openLightbox(img){
    $('lightboxImg').src = img.src;
    $('lightboxCaption').textContent = img.alt || '';
    $('lightbox').classList.remove('hidden');
  }
  function closeLightbox(){
    $('lightbox').classList.add('hidden');
    $('lightboxImg').src = '';
  }

  /* ---------- 右键粘贴菜单 ---------- */
  function openCtxMenu(x, y, row){
    ctxRow = row;
    const menu = $('ctxMenu');
    const hasImg = !!row.dataset.image;
    menu.querySelector('[data-ctx="copy"]').disabled = !hasImg;
    menu.querySelector('[data-ctx="view"]').disabled = !hasImg;
    menu.querySelector('[data-ctx="remove"]').disabled = !hasImg;
    menu.classList.remove('hidden');
    const r = menu.getBoundingClientRect();
    const w = r.width || menu.offsetWidth || 170;
    const h = r.height || menu.offsetHeight || 200;
    let px = x, py = y;
    if(x + w > window.innerWidth - 8) px = Math.max(8, window.innerWidth - w - 8);
    if(y + h > window.innerHeight - 8) py = Math.max(8, window.innerHeight - h - 8);
    menu.style.left = px + 'px';
    menu.style.top = py + 'px';
  }

  function closeCtxMenu(){
    $('ctxMenu').classList.add('hidden');
    ctxRow = null;
  }

  /* ---------- 导入 / 导出 / 重置 ---------- */
  function exportJSON(){
    const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = '硬件学习知识库.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('已导出 JSON 文件');
  }

  function importFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const arr = JSON.parse(reader.result);
        if(!Array.isArray(arr)) throw new Error('not array');
        DATA = normalizeData(arr);
        saveData();
        refresh();
        toast('已导入 ' + arr.length + ' 条');
      }catch(err){
        alert('导入失败：文件不是有效的 JSON 数组。');
      }
    };
    reader.readAsText(file);
  }

  function resetData(){
    if(!confirm('确定恢复为示例数据？当前所有本地编辑将被清除。')) return;
    localStorage.removeItem(STORAGE_KEY);
    DATA = normalizeData(SEED());
    activeCategory = '全部';
    searchTerm = '';
    $('search').value = '';
    refresh();
  }

  /* ---------- 事件绑定 ---------- */
  $('search').addEventListener('input', e => { searchTerm = e.target.value; render(); });

  $('btnBoard').addEventListener('click', () => setView('board'));
  $('btnCalendar').addEventListener('click', () => setView('calendar'));
  $('btnList').addEventListener('click', () => setView('list'));
  $('btnMap').addEventListener('click', () => setView('map'));
  $('btnEdit').addEventListener('click', () => setEditMode(!editMode));
  $('btnAdd').addEventListener('click', () => openModal(null));
  $('fabAdd').addEventListener('click', () => openModal(null));

  // 看板：点击卡片查看详情
  $('boardView').addEventListener('click', e => {
    const card = e.target.closest('.board-card[data-id]');
    if(card) openDetail(Number(card.dataset.id));
  });

  // 日历：月份切换 / 选择日期 / 点击条目
  $('calendarView').addEventListener('click', e => {
    const nav = e.target.closest('[data-calnav]');
    if(nav){
      const act = nav.dataset.calnav;
      const now = new Date();
      if(act === 'prev'){ calCursor.m--; if(calCursor.m < 0){ calCursor.m = 11; calCursor.y--; } }
      else if(act === 'next'){ calCursor.m++; if(calCursor.m > 11){ calCursor.m = 0; calCursor.y++; } }
      else if(act === 'today'){ calCursor = { y: now.getFullYear(), m: now.getMonth() }; calSelected = today(); }
      renderCalendar();
      return;
    }
    const cell = e.target.closest('.cal-cell[data-date]');
    if(cell){ calSelected = cell.dataset.date; renderCalendar(); return; }
    const item = e.target.closest('[data-calitem]');
    if(item) openDetail(Number(item.dataset.calitem));
  });

  // 列表：卡片操作 + 图片灯箱（事件委托）
  $('listView').addEventListener('click', e => {
    const img = e.target.closest('img[data-lightbox]');
    if(img){ openLightbox(img); return; }
    const viewBtn = e.target.closest('[data-act="view"]');
    if(viewBtn){
      const card = viewBtn.closest('.card[data-id]');
      if(card) openDetail(Number(card.dataset.id));
      return;
    }
    if(!editMode) return;
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    const card = btn.closest('.card[data-id]');
    if(!card) return;
    const id = Number(card.dataset.id);
    const act = btn.dataset.act;
    if(act === 'edit') openModal(DATA.find(d => d.id === id));
    else if(act === 'del') deleteEntry(id);
    else if(act === 'up') moveEntry(id, -1);
    else if(act === 'down') moveEntry(id, 1);
  });

  // 核心要点编辑器（事件委托）
  $('pointsEditor').addEventListener('click', e => {
    const thumb = e.target.closest('.p-thumb');
    if(thumb){ openLightbox(thumb); return; }
    const btn = e.target.closest('[data-op]');
    if(!btn) return;
    const row = btn.closest('.point-row');
    if(!row) return;
    const op = btn.dataset.op;
    if(op === 'del') row.remove();
    else if(op === 'img') row.querySelector('.p-file').click();
    else if(op === 'rmimg') clearRowImage(row);
    else if(op === 'paste') pasteFromClipboard(row);
    else if(op === 'copy') copyRowImage(row);
  });

  $('pointsEditor').addEventListener('change', e => {
    if(!e.target.classList.contains('p-file')) return;
    const row = e.target.closest('.point-row');
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    if(!/^image\//.test(file.type)){ toast('请选择图片文件'); return; }
    fileToDataURL(file).then(dataUrl => {
      setRowImage(row, dataUrl);
      toast('图片已添加');
    }).catch(() => toast('图片读取失败'));
  });

  $('pointsEditor').addEventListener('paste', e => {
    const textarea = e.target.closest('.p-text');
    if(!textarea) return;
    const items = (e.clipboardData && e.clipboardData.items) || [];
    let imgFile = null;
    for(const it of items){
      if(it.type && it.type.indexOf('image/') === 0){ imgFile = it.getAsFile(); break; }
    }
    if(!imgFile) return;
    e.preventDefault();
    const row = textarea.closest('.point-row');
    if(!row) return;
    fileToDataURL(imgFile).then(dataUrl => {
      setRowImage(row, dataUrl);
      toast('截图已粘贴 ✓');
    }).catch(() => toast('图片读取失败'));
  });

  $('pointsEditor').addEventListener('contextmenu', e => {
    const row = e.target.closest('.point-row');
    if(!row) return;
    e.preventDefault();
    openCtxMenu(e.clientX, e.clientY, row);
  });

  $('btnAddPoint').addEventListener('click', () => $('pointsEditor').appendChild(pointRow(null)));

  // 模态框
  $('modalSave').addEventListener('click', saveForm);
  $('modalCancel').addEventListener('click', closeModal);
  $('modalClose').addEventListener('click', closeModal);
  $('modal').addEventListener('click', e => { if(e.target === $('modal')) closeModal(); });

  // 详情模态框
  $('detailClose').addEventListener('click', closeDetail);
  $('detailDone').addEventListener('click', closeDetail);
  $('detailModal').addEventListener('click', e => {
    if(e.target === $('detailModal')){ closeDetail(); return; }
    const img = e.target.closest('img[data-lightbox]');
    if(img){ openLightbox(img); return; }
    const btn = e.target.closest('[data-dact]');
    if(!btn) return;
    const act = btn.dataset.dact;
    const d = detailId != null ? DATA.find(x => x.id === detailId) : null;
    if(!d) return;
    if(act === 'status'){
      d.status = btn.dataset.status;
      saveData(true);
      renderDetail(d);
      updateStats();
    }else if(act === 'edit'){
      closeDetail();
      openModal(d);
    }else if(act === 'del'){
      closeDetail();
      deleteEntry(d.id);
    }
  });
  // 拖动滑块：实时更新显示，不整体重渲染（避免拖动中断）
  $('detailModal').addEventListener('input', e => {
    if(e.target.id !== 'detailRange') return;
    const d = detailId != null ? DATA.find(x => x.id === detailId) : null;
    if(!d) return;
    const p = Number(e.target.value);
    d.mastery = p;
    const lv = masteryLevel(p);
    const fill = $('detailFill'); if(fill){ fill.style.width = p + '%'; fill.style.background = lv.color; }
    const lvl = $('detailLvl'); if(lvl){ lvl.textContent = lv.label; lvl.style.color = lv.color; }
    const pct = $('detailPct'); if(pct){ pct.textContent = p + '%'; pct.style.color = lv.color; }
  });
  $('detailModal').addEventListener('change', e => {
    const d = detailId != null ? DATA.find(x => x.id === detailId) : null;
    if(!d) return;
    if(e.target.id === 'detailRange'){
      saveData(true);
    }else if(e.target.id === 'detailAuto'){
      if(e.target.checked){ d.mastery = null; }
      else { d.mastery = computedMastery(d); }
      saveData(true);
      renderDetail(d);
      updateStats();
    }
  });

  // 灯箱
  $('lightboxClose').addEventListener('click', closeLightbox);
  $('lightbox').addEventListener('click', e => { if(e.target === $('lightbox')) closeLightbox(); });

  // 右键菜单
  $('ctxMenu').addEventListener('click', e => {
    const btn = e.target.closest('[data-ctx]');
    if(!btn || !ctxRow) return;
    const act = btn.dataset.ctx;
    const row = ctxRow;
    closeCtxMenu();
    if(act === 'paste') pasteFromClipboard(row);
    else if(act === 'copy') copyRowImage(row);
    else if(act === 'view'){ const t = row.querySelector('.p-thumb'); if(t.src) openLightbox(t); }
    else if(act === 'remove') clearRowImage(row);
  });

  document.addEventListener('click', e => {
    if(!$('ctxMenu').classList.contains('hidden') && !e.target.closest('#ctxMenu')) closeCtxMenu();
  });
  document.addEventListener('scroll', closeCtxMenu, true);
  window.addEventListener('resize', closeCtxMenu);

  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    if(!$('ctxMenu').classList.contains('hidden')) closeCtxMenu();
    else if(!$('modal').classList.contains('hidden')) closeModal();
    else if(!$('detailModal').classList.contains('hidden')) closeDetail();
    else if(!$('lightbox').classList.contains('hidden')) closeLightbox();
  });

  // 页脚
  $('btnExport').addEventListener('click', exportJSON);
  $('btnImport').addEventListener('click', () => $('fileImport').click());
  $('fileImport').addEventListener('change', e => {
    const f = e.target.files[0];
    if(f) importFile(f);
    e.target.value = '';
  });
  $('btnReset').addEventListener('click', resetData);

  /* ---------- 初始化 ---------- */
  refresh();
})();
</script>
</body>
</html>
